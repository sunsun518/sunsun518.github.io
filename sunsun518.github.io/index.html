<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sunsun518 tools</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #E7ECF1;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    color: #18212B;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 20px;
  }
  h1 {
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif;
    font-size: 22px; font-weight: 600; margin-bottom: 6px;
  }
  p.sub { font-size: 13px; color: #5C6B7A; margin-bottom: 36px; }
  .list { width: 100%; max-width: 420px; display: grid; gap: 12px; }
  a.item {
    display: block; background: #FFFFFF; border-radius: 14px; padding: 18px 20px;
    text-decoration: none; color: inherit; box-shadow: 0 2px 10px rgba(24,33,43,.08);
    border-left: 5px solid #2F5597;
  }
  a.item .name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  a.item .desc { font-size: 12.5px; color: #5C6B7A; }
</style>
</head>
<body>
  <h1>sunsun518 tools</h1>
  <p class="sub">個人用に公開しているツール一覧</p>
  <div class="list">
    <a class="item" href="./giken-vocab/">
      <div class="name">G検定 単語帳</div>
      <div class="desc">G検定対策の単語帳アプリ（カード・クイズ・一覧、592語）</div>
    </a>
  </div>
</body>
</html>
